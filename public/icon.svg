<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Dark Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#221A15" />
      <stop offset="100%" stop-color="#0D0B0A" />
    </linearGradient>

    <!-- Metallic Champagne Gradients -->
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF9F2" />
      <stop offset="35%" stop-color="#E3BE98" />
      <stop offset="100%" stop-color="#96663E" />
    </linearGradient>

    <linearGradient id="loopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9F2" />
      <stop offset="40%" stop-color="#E8C4A0" />
      <stop offset="80%" stop-color="#C29064" />
      <stop offset="100%" stop-color="#8A5932" />
    </linearGradient>

    <!-- Drop Shadow for stem depth -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-4" dy="8" stdDeviation="7" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <!-- Overall subtle ambient glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Dark Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <rect width="508" height="508" x="2" y="2" rx="126" fill="none" stroke="rgba(227, 190, 152, 0.16)" stroke-width="2" />
  <circle cx="270" cy="210" r="160" fill="#E3BE98" opacity="0.07" />

  <!-- Stylized Letter P -->
  <g filter="url(#glow)">
    <!-- Sweeping Loop -->
    <path d="M204 96 H284 C354 96 404 142 404 208 C404 274 354 320 284 320 H204 V264 H280 C318 264 348 240 348 208 C348 176 318 152 280 152 H204 Z" fill="url(#loopGrad)" />

    <!-- Vertical Stem with 45° Chamfer Cut -->
    <path d="M148 152 L204 96 V392 C204 405 193 416 180 416 C167 416 148 405 148 392 Z" fill="url(#stemGrad)" filter="url(#shadow)" />

    <!-- Top Chamfer Highlight Line -->
    <line x1="148" y1="152" x2="204" y2="96" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.75" />
  </g>
</svg>